name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      OPENAI_API_KEY: ""
      WORKBENCH_RUN_LIVE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install workbench
        run: python -m pip install --no-deps -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Check formatting
        run: python -m ruff format --check app tests scripts
      - name: Run offline tests
        run: python -m pytest -q -m "not live"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
