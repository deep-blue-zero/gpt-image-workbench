name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for the version in pyproject.toml
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ""
      WORKBENCH_RUN_LIVE: ""
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt
      - name: Validate release identity
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable semantic version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag does not match pyproject.toml version.'
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-lock.txt -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
      - name: Lint and test offline
        run: |
          python -m ruff check app tests scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check app tests scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q -m "not live" --junitxml=build/tests.xml
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $compiler = & ./scripts/install_inno.ps1 -ToolsDir "$env:RUNNER_TEMP/workbench-tools"
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Build installer and portable ZIP
        run: python scripts/build_windows.py --iscc "$env:ISCC_PATH"
      - name: Test packages, upgrade, and uninstall
        run: python scripts/smoke_windows.py --report build/windows-smoke.json
      - name: Save release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ steps.version.outputs.tag }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-${{ github.run_id }}
          path: |
            build/tests.xml
            build/windows-smoke.json
          if-no-files-found: ignore
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/releases -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "GPT Image Workbench $env:RELEASE_TAG" --notes-file packaging/windows/RELEASE-NOTES.md @assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
